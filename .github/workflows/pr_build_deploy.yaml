name: Sync & Build Quartz
on:
  schedule:
    - cron: '30 1 * * *' 
  workflow_dispatch:
    inputs:
      run_sync:
        description: 'Sync Main to Publish'
        type: boolean
        default: true
      run_build:
        description: 'Build & Deploy Quartz Site to pages'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-branches:
    if: github.event_name == 'schedule' || github.event.inputs.run_sync == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-diff.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check for changes and Merge
        id: check-diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main publish
          # Check if main has commits not in publish
          DIFF=$(git log origin/publish..origin/main --oneline)
          
          if [ -z "$DIFF" ]; then
            echo "No changes to sync."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          
          # Create PR and attempt auto-merge
          PR_URL=$(gh pr create \
            --base publish \
            --head main \
            --title "Automated Sync: main to publish" \
            --body "Automated sync generated by GitHub Actions." \
            2>/dev/null || echo "exists")

          if [ "$PR_URL" != "exists" ]; then
            # Using --admin to bypass branch protection if necessary
            gh pr merge "$PR_URL" --merge --admin
          fi

  build-and-deploy:
    needs: sync-branches
    # Runs if sync succeeded OR was skipped (meaning no sync was requested, but we still want to build)
    if: |
      always() && 
      (github.event_name == 'schedule' || github.event.inputs.run_build == 'true') &&
      (needs.sync-branches.result == 'success' || needs.sync-branches.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: publish # This ensures we build the branch we just merged into

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Quartz
        uses: konstfish/quartz-build-action@v7
        with:
          source: .
          page_title: "Cascade STEAM"
          quartz_icon: .github/quartz/icon.png
          quartz_custom_css: .github/quartz/custom.scss
          quartz_banner: assets/images/Cascade_STEAM_horizontal_logo_primary.svg
          # Changed to HTTPS to fix the "cannot run ssh" error
          quartz_repo: https://github.com/CascadeSTEAM/quartz.git
          quartz_repo_ref: csmods          
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}