name: Weekly Sync Main to Publish
on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger for testing

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for all branches

      - name: Create and Auto-Merge PR
        run: |
          # 1. Fetch the latest state of both branches from the remote
          git fetch origin main publish

          # 2. Check if there is actually a diff between the remote branches
          # This prevents the 'no changes to sync' error by checking first
          DIFF=$(git diff origin/publish...origin/main)

          if [ -z "$DIFF" ]; then
            echo "No changes to sync: origin/main and origin/publish are identical."
            exit 0
          fi

          # 3. Create the PR using explicit remote references
          # -B (base) and -H (head) must be branches that exist on the remote
          PR_URL=$(gh pr create \
            --base publish \
            --head main \
            --title "Weekly Sync: main to publish" \
            --body "Automated weekly sync of main into publish branch." \
            2>/dev/null || echo "exists")

          # 4. Process the PR (Merge)
          if [ "$PR_URL" != "exists" ]; then
            echo "PR created: $PR_URL"
            # Use --auto to wait for status checks, or --merge for immediate action
            gh pr merge "$PR_URL" --merge --delete-branch=false
          else
            echo "A Pull Request already exists for these changes."
          fi

